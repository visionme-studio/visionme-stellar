title = "gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "stellar-secret-seed"
description = "Stellar Ed25519 secret seed"
regex = '\bS[A-Z0-9]{55}\b'
secretGroup = 0
tags = ["key", "stellar"]

[[rules]]
id = "stellar-contract-id"
description = "Stellar contract id"
regex = '\bC[A-Z0-9]{55}\b'
secretGroup = 0
tags = ["id", "stellar"]

[[rules]]
id = "stripe-secret-key"
description = "Stripe secret key"
regex = '\bsk_(live|test)_[a-zA-Z0-9]{16,}\b'
secretGroup = 0
tags = ["key", "stripe"]

[[allowlists]]
description = "Public testnet contract ids and fixtures"
paths = [
  'contracts/contracts/pocket-test/pocket-test.ts',
]
regexes = [
  '\n',
]
