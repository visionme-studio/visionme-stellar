name: CI

on:
  push:
    branches: [""]
  pull_request:

# Token is read-only by default; no job here needs write access.
permissions:
  contents: read

# Cancel in-progress runs for the same ref so overlapping pushes don't duplicate work.
concurency:
  group: $${{ github.workflow }}-$${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build --if-present
