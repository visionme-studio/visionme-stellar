name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  contracts-fmt:
    name: Contracts format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolay/rust-toolchain-action@v1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
