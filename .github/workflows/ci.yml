name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
